name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: >-
          sca-reachability analyze
          --sbom fixtures/demo-sbom.json
          --osv-response fixtures/demo-osv-response.json
          > demo-report.json
      - run: >-
          python -c "import json; report=json.load(open('demo-report.json'));
          assert report['assessment'] == 'findings_present';
          assert report['summary']['unknown'] == 1"
