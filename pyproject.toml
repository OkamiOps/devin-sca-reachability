[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-sca-reachability"
version = "0.1.0"
description = "Offline scaffold for dependency vulnerability reachability analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sca-reachability = "sca_reachability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
